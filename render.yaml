services:
  - type: web
    name: whatsapp-ai-bot
    env: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PHONE_NUMBER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: HF_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: OPENROUTER_MODEL
        value: google/gemini-2.0-flash-exp:free
      - key: BANK_INFO
        sync: false
      - key: MAX_HISTORY
        value: 20
      - key: MAX_PER_HOUR
        value: 30
      - key: HANDOFF_MINUTES
        value: 120
      - key: IGNORE_GROUPS
        value: true
