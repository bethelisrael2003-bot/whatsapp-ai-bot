name: Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging https://whatsapp-ai-bot-xvp1.onrender.com/health"
          curl -s -o /dev/null -w "%{http_code}" https://whatsapp-ai-bot-xvp1.onrender.com/health
          curl -s https://whatsapp-ai-bot-xvp1.onrender.com/health || echo "Failed but will retry"
          echo "Ping done at $(date)"
      
      - name: Ping root
        run: |
          curl -s https://whatsapp-ai-bot-xvp1.onrender.com/ || true
